# DESABILITADO: todo push falha com "denied: permission_denied: read_package"
# (antes, "403 Forbidden") ao publicar em ghcr.io/prodmais-umc/prodmais. Causa:
# política de criação de pacotes da organização Prodmais-UMC bloqueando o
# GITHUB_TOKEN do workflow — só se ajusta pela interface web do GitHub
# (Settings → Packages da organização), sem endpoint de API disponível.
# Não afeta a produção: o Render builda direto do Dockerfile.render no push,
# sem depender dessa imagem no GHCR.
#
# Pra reativar depois que a política for ajustada: devolva o "push:" nos
# triggers abaixo.
name: Publicar imagem Docker no GitHub Packages

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
